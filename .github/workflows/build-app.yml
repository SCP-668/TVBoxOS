name: Build APP (self branch)

on:
  workflow_dispatch:
  push:
    branches: [APP]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: APP
          fetch-depth: 0

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Inject release signing
        working-directory: ${{ github.workspace }}
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" | base64 -d)"
          signingConfig="$(echo "$signingConfig" | base64 -d)"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp -f .github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties
          sed -i 's/^#\(org.gradle.jvmargs=.*\)/\1/'        ./gradle.properties
          echo "--- build.gradle 签名段预览 ---"
          grep -n "signingConfig\|myConfig\|RELEASE_" app/build.gradle | head -20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --warning-mode all --no-daemon

      - name: Prepare APKs
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp -f {} apk-out/ \;
          echo "--- APK 列表 ---"
          ls -lh apk-out/
          echo "--- 签名校验 ---"
          for f in apk-out/*.apk; do
            echo "== $f =="
            keytool -printcert -jarfile "$f" 2>/dev/null | grep -E "Owner|SHA256|Valid" | head -6 || true
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-APP-apks
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-latest
          name: APP Build Latest
          body: Auto build from APP branch (${{ github.sha }})
          files: apk-out/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
